<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр по экологии</title>
<meta name="description" content="Бесплатный тренажёр для подготовки к тестированию i-exam по экологии: 106 вопросов, пояснения, работа над ошибками и экзамен с таймером.">
<meta name="theme-color" content="#ECF0ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Тренажёр по экологии">
<meta property="og:description" content="Подготовка к тестированию i-exam: тренировка с пояснениями, работа над ошибками и экзамен с таймером.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C5B71'/%3E%3Cpath d='M46 16C28 16 18 26 18 40c0 3 1 6 2 8 4-12 12-19 22-22-9 5-15 12-18 23 2 1 4 1 6 1 14 0 20-12 16-34z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like an exam booklet. Home: progress → modes → topic tree in the i-exam "Раздел / Тема" form. Quiz: one task card with a sticky answer bar. */
:root{
  --bg:#ECF0ED;
  --surface:#FFFFFF;
  --sunk:#E1E8E3;
  --ink:#14201A;
  --muted:#53635B;
  --line:#CDD8D1;
  --accent:#1C5B71;
  --accent-ink:#FFFFFF;
  --accent-soft:#D6E6EC;
  --ok:#1C7244;
  --on-ok:#FFFFFF;
  --ok-soft:#DAEEE1;
  --bad:#AE3629;
  --on-bad:#FFFFFF;
  --bad-soft:#F6DED9;
  --shadow:0 1px 2px rgba(20,32,26,.10);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#151E1B; --sunk:#1C2723; --ink:#E3EBE7; --muted:#93A49C; --line:#2B3934;
    --accent:#80C2D8; --accent-ink:#0A1A20; --accent-soft:#183039;
    --ok:#62C98E; --on-ok:#0B1F13; --ok-soft:#14301F; --bad:#EF8272; --on-bad:#2A0E0A; --bad-soft:#3A1C18;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151E1B; --sunk:#1C2723; --ink:#E3EBE7; --muted:#93A49C; --line:#2B3934;
  --accent:#80C2D8; --accent-ink:#0A1A20; --accent-soft:#183039;
  --ok:#62C98E; --on-ok:#0B1F13; --ok-soft:#14301F; --bad:#EF8272; --on-bad:#2A0E0A; --bad-soft:#3A1C18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:44rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.eyebrow{font-family:var(--font-mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.section-title{font-size:1.05rem;font-weight:600}

/* ---------- home ---------- */
.home{display:grid;gap:28px}
.masthead{display:grid;gap:10px;padding-top:4px}
.masthead h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,6.4vw,2.4rem);line-height:1.12;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:36rem}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.summary>div{padding:14px 16px;display:grid;gap:2px;min-width:0}
.summary>div+div{border-left:1px solid var(--line)}
.summary .k{font-size:.8rem;color:var(--muted)}
.summary .v{font-family:var(--font-display);font-weight:500;font-size:1.4rem;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.summary .v small{font-family:var(--font-body);font-size:.85rem;font-weight:400;color:var(--muted);margin-left:3px}
.modes{display:grid;gap:12px}
.mode{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mode-main{flex:1 1 15rem;min-width:0;display:grid;gap:4px}
.mode h3{font-size:1.05rem;font-weight:600}
.mode p{color:var(--muted);font-size:.92rem}
.mode-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:.88rem;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-size:.9rem;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.link.danger{color:var(--bad)}
.notice{font-size:.9rem;color:var(--bad)}

.topics{display:grid;gap:10px}
.topics-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.topics-actions{display:flex;gap:12px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tree>li+li{border-top:1px solid var(--line)}
.tree ul{padding-bottom:8px}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 16px;cursor:pointer}
.sec-row{padding-block:12px;font-weight:600}
.tree ul .row{padding-left:48px}
.row input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.row .name{min-width:0;overflow-wrap:anywhere}
.row:hover .name{color:var(--accent)}
.tag{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.stat{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{width:44px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
.soon .row{cursor:default;color:var(--muted)}
.soon .row:hover .name{color:var(--muted)}
.soon .box{width:16px;height:16px;border:1.5px dashed var(--line);border-radius:4px;justify-self:center}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;font-size:.88rem;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px;padding-block:0 0}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:10px;padding-block:14px 8px}
.qbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qbar-right{display:flex;align-items:center;gap:10px}
.count{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.timer{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px;min-width:0}
.q-meta{display:grid;gap:6px}
.hint{font-size:.85rem;font-weight:600;color:var(--accent)}
.q-text{font-size:1.16rem;font-weight:500;line-height:1.42;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.is-chosen{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt-text{min-width:0;overflow-wrap:anywhere}
.mark{width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;line-height:1}
.opt-many .mark{border-radius:5px}
.opt.is-chosen .mark{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt-one.is-chosen .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt-many.is-chosen .mark::after{content:"✓"}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.is-correct .mark{border-color:var(--ok);background:var(--ok);color:var(--on-ok)}
.opt.is-correct .mark::after{content:"✓";width:auto;height:auto;border-radius:0;background:none}
.opt.is-missed{background:var(--surface);border-style:dashed}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.is-wrong .mark{border-color:var(--bad);background:var(--bad);color:var(--on-bad)}
.opt.is-wrong .mark::after{content:"✕";width:auto;height:auto;border-radius:0;background:none}
.opt.is-dim{opacity:.6}
.miss-tag{font-size:.72rem;font-weight:600;color:var(--ok);white-space:nowrap}
kbd{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.opt:disabled kbd{visibility:hidden}
@media (hover:none){kbd,.keys{display:none}}

.m-legend{list-style:none;margin:0;padding:12px 14px;display:grid;gap:8px;background:var(--sunk);border-radius:11px}
.m-legend li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.m-legend b{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.m-rows{display:grid;gap:10px}
.m-row{display:grid;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:11px}
.m-row.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.m-row.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.m-left{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-weight:500}
.num{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:30px}
.chip{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-weight:600;cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{cursor:default}
.chip:disabled:not(.right):not(.bad){opacity:.4}
.chip.right{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.chip.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}

.ord-label{font-size:.8rem;font-weight:600;color:var(--muted)}
.ord-seq{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slot{border:1px solid var(--line);border-radius:11px;min-height:48px}
.slot.empty{border-style:dashed;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;color:var(--muted);font-size:.88rem}
.slot button{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:11px 14px;text-align:left;background:transparent;border:0;border-radius:11px;cursor:pointer}
.slot button:disabled{cursor:default}
.slot .x{color:var(--muted);font-size:1.1rem;line-height:1}
.slot.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.slot.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord-pool{display:grid;gap:8px}
.ord-pool .opt{grid-template-columns:minmax(0,1fr) auto}

.fb{display:grid;gap:8px;padding:14px 16px;border-radius:12px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb-head{font-weight:700}
.fb.ok .fb-head{color:var(--ok)}
.fb.bad .fb-head{color:var(--bad)}
.fb ol{margin:0;padding-left:1.3rem}
.keys{text-align:center}
.actions{position:sticky;bottom:0;z-index:4;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding-block:14px max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
@media (max-width:520px){.actions .btn{flex:1 1 auto}}

/* ---------- result ---------- */
.result{display:grid;gap:28px}
.res-head{display:grid;gap:6px}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.score .big{font-family:var(--font-display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.score .of{font-size:1.1rem;color:var(--muted)}
.block{display:grid;gap:10px}
.t-rows{display:grid;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.t-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 40px;gap:12px;align-items:center;font-size:.92rem}
.t-row .name{min-width:0}
.t-row .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.t-row .bar i{display:block;height:100%;background:var(--ok)}
.t-row .bar i.low{background:var(--bad)}
.t-row .n{font-family:var(--font-mono);font-size:.8rem;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.errs{display:grid;gap:8px}
.err{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.err summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-weight:500;cursor:pointer;list-style:none}
.err summary::-webkit-details-marker{display:none}
.err summary::after{content:"+";font-family:var(--font-mono);color:var(--muted)}
.err[open] summary::after{content:"−"}
.err-body{display:grid;gap:12px;margin-top:12px;font-size:.94rem}
.lbl{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.err-body ul,.err-body ol{margin:4px 0 0;padding-left:1.2rem}
.yours{color:var(--bad)}
.right-ans{color:var(--ok)}
@media (max-width:420px){
  .summary .v{font-size:1.15rem}
  .summary>div{padding:12px}
  .tree ul .row{padding-left:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<main id="home" class="wrap home"></main>
<main id="quiz" class="wrap quiz" hidden></main>
<main id="result" class="wrap result" hidden></main>

<script>
/* ===== Структура курса (как в дереве тем i-exam) ===== */
const SECTIONS = [
  {id:'s1', name:'Биосфера', topics:[['b1','Экология как наука'],['b2','Понятие биосферы, её структура'],['b3','Живое вещество биосферы, его функции'],['b4','Круговороты веществ в биосфере']]},
  {id:'s2', name:'Экосистемы', topics:[]},
  {id:'s3', name:'Организм и среда', topics:[['o1','Основные среды жизни'],['o2','Экологические факторы среды'],['o3','Закономерности действия экологических факторов на живые организмы'],['o4','Адаптация организмов к изменениям экологических факторов']]},
  {id:'s4', name:'Глобальные экологические проблемы', topics:[['g1','«Парниковый эффект»'],['g2','«Озоновые дыры»'],['g3','Проблема кислотных осадков'],['g4','Энергетическая проблема'],['g5','Проблемы народонаселения и продовольствия'],['g6','Сокращение биоразнообразия']]},
  {id:'s5', name:'Антропогенное воздействие на окружающую среду', topics:[['a1','Источники и виды антропогенных воздействий на окружающую среду'],['a2','Антропогенное воздействие на атмосферу'],['a3','Антропогенное воздействие на гидросферу'],['a4','Антропогенное изменение литосферы'],['a5','Отходы и их влияние на окружающую среду'],['a6','Физическое загрязнение окружающей среды']]},
  {id:'s6', name:'Рациональное природопользование и охрана окружающей среды', topics:[]},
  {id:'s7', name:'Социально-экономические аспекты экологии', topics:[]},
  {id:'s8', name:'Кейс-задания', topics:[]},
];

/* ===== Банк вопросов =====
   k: one — один ответ (верный вариант всегда первый в списке, порядок перемешивается при показе)
      many — несколько ответов (a — индексы верных)
      match — соответствие (p — пары, x — лишние варианты справа)
      order — последовательность (o — в правильном порядке) */
const B = {
b1:[
 {k:'one', q:'Термин «экология» впервые ввёл в науку', o:['Э. Геккель','В. И. Вернадский','Ч. Дарвин','А. Тенсли'], e:'Эрнст Геккель предложил термин в 1866 г. в труде «Общая морфология организмов». Греч. oikos — дом, жилище, logos — учение.'},
 {k:'one', q:'Экология — это наука о', o:['взаимоотношениях организмов между собой и с окружающей средой','строении и функциях клеток живых организмов','закономерностях наследственности и изменчивости','историческом развитии органического мира'], e:'Экология изучает связи организмов, популяций и сообществ друг с другом и со средой обитания.'},
 {k:'match', q:'Установите соответствие между разделом экологии и объектом его изучения', p:[['Аутэкология','отдельный организм (вид) и его связи со средой'],['Демэкология','популяции'],['Синэкология','сообщества и экосистемы']], x:['строение и функции клетки'], e:'Аутэкология изучает особь и вид, демэкология — популяции, синэкология — сообщества (биоценозы) и экосистемы. Клетку изучает цитология.'},

 {k:'order', q:'Установите последовательность процессов, ведущих к разрушению озонового слоя', o:['выброс фреонов из холодильников и аэрозолей','перенос фреонов в стратосферу','распад фреонов под действием ультрафиолета с выделением хлора','реакция хлора с озоном','истончение озонового слоя и рост ультрафиолета у поверхности'], e:'Фреоны устойчивы и годами поднимаются в стратосферу. Там ультрафиолет высвобождает атомы хлора, которые запускают цепное разрушение озона.'},
 {k:'one', q:'Один атом хлора, высвободившийся из фреона, способен разрушить', o:['до 100 000 молекул озона','только одну молекулу озона','около 10 молекул озона','до 100 молекул озона'], e:'Хлор действует как катализатор: после реакции Cl + O₃ → ClO + O₂ он высвобождается снова и вступает в новую реакцию.'},

 {k:'many', q:'Последствиями истончения озонового слоя являются', o:['рост заболеваемости раком кожи','рост заболеваемости катарактой','угнетение фитопланктона и снижение урожайности','повышение уровня Мирового океана','выпадение кислотных дождей'], a:[0,1,2], e:'Усиление ультрафиолета повреждает ДНК, глаза и иммунитет, угнетает фотосинтез. Подъём уровня океана связан с парниковым эффектом, кислотные дожди — с оксидами серы и азота.'},

const range = n => Array.from({length: n}, (_, i) => i);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }

const poolSelected = () => QUESTIONS.filter(q => store.sel.includes(q.t));
function trainIds() {
  const st = store.stats, pool = poolSelected();
  const wrong = shuffle(pool.filter(q => st[q.id] && st[q.id].last === 0));
  const fresh = shuffle(pool.filter(q => !st[q.id]));
  const known = pool.filter(q => st[q.id] && st[q.id].last === 1).sort((a, b) => st[a.id].ts - st[b.id].ts);
  const all = wrong.concat(fresh, known).map(q => q.id);
  const n = store.trainLen === 'all' ? all.length : Math.min(store.trainLen, all.length);
  return shuffle(all.slice(0, n));
}
function examIds() {
  const byT = {};
  poolSelected().forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const topics = shuffle(Object.keys(byT));
  topics.forEach(t => { byT[t] = shuffle(byT[t]); });
  const out = [];
  while (out.length < store.examLen && topics.some(t => byT[t].length)) {
    for (const t of topics) { if (out.length >= store.examLen) break; const q = byT[t].pop(); if (q) out.push(q.id); }

}

/* ===== Сессия ===== */
const cur = () => QMAP[S.ids[S.i]];
function makePerm(q) {
  if (q.k === 'one' || q.k === 'many') return shuffle(range(q.o.length));
  if (q.k === 'match') return shuffle(range(q.p.length + (q.x ? q.x.length : 0)));
  let p; do { p = shuffle(range(q.o.length)); } while (p.every((v, i) => v === i));
  return p;
}
function emptyDraft(q) { return q.k === 'one' ? null : q.k === 'match' ? q.p.map(() => -1) : []; }
function complete(q, d) {
  if (q.k === 'one') return d !== null;
  if (q.k === 'many') return d.length > 0;
  if (q.k === 'match') return d.every(v => v >= 0);
  return d.length === q.o.length;
}
function correctOf(q) { return q.k === 'one' ? q.a : q.k === 'many' ? q.a : range(q.k === 'match' ? q.p.length : q.o.length); }
function check(q, d) {
  if (q.k === 'one') return d === q.a;
  if (q.k === 'many') { const a = q.a.slice().sort(), b = d.slice().sort(); return a.length === b.length && a.every((v, i) => v === b[i]); }
  return d.every((v, i) => v === i);
}
function record(id, ok) {
  const s = store.stats[id] || {n: 0, c: 0};

      if (!AVAIL.includes(id)) return `<li class="soon"><div class="row"><span class="box" aria-hidden="true"></span><span class="name"><span class="tag">Тема</span>${esc(name)}</span><span class="stat">скоро</span></div></li>`;
      const total = B[id].length, m = B[id].filter(q => st[q.id] && st[q.id].last === 1).length;
      return `<li><label class="row"><input type="checkbox" data-topic="${id}"${store.sel.includes(id) ? ' checked' : ''}><span class="name"><span class="tag">Тема</span>${esc(name)}</span><span class="stat" title="Освоено ${m} из ${total}"><span class="meter"><i style="width:${m / total * 100}%"></i></span>${m}/${total}</span></label></li>`;
    }).join('');
    return `<li><label class="row sec-row"><input type="checkbox" data-sec="${s.id}" data-ind="${selN > 0 && selN < ts.length ? 1 : 0}"${selN === ts.length ? ' checked' : ''}><span class="name"><span class="tag">Раздел</span>${esc(s.name)}</span><span class="stat">${selN}/${ts.length}</span></label><ul>${topics}</ul></li>`;
  }).join('');

  home.innerHTML = `
    <header class="masthead">
      <p class="eyebrow">Подготовка к тестированию i-exam</p>
      <h1>Тренажёр по экологии</h1>
      <p class="lede">${QUESTIONS.length} ${plural(QUESTIONS.length, W_Q)} по ${AVAIL.length} темам в форматах заданий i-exam: один ответ, несколько ответов, соответствие и последовательность.</p>
    </header>
    <section class="summary" aria-label="Ваш прогресс">
      <div><span class="k">Освоено</span><span class="v">${mastered}<small>из ${QUESTIONS.length}</small></span></div>
      <div><span class="k">Точность</span><span class="v">${n ? Math.round(c * 100 / n) + '%' : '—'}</span></div>
      <div><span class="k">К разбору</span><span class="v">${mistakes}</span></div>
    </section>
    <section class="modes" aria-label="Режимы">
      <article class="mode">
        <div class="mode-main"><h3>Тренировка</h3><p>Пояснение после каждого ответа. Сначала идут вопросы с ошибками и новые.</p></div>
        <div class="mode-ctl">${seg('train-len', store.trainLen, [[10, '10'], [20, '20'], ['all', 'Все']], 'Количество вопросов')}<button type="button" class="btn primary" data-act="start-train"${pool ? '' : ' disabled'}>Начать</button></div>
      </article>
      <article class="mode">
        <div class="mode-main"><h3>Работа над ошибками</h3><p>${mistakes ? `${mistakes} ${plural(mistakes, W_Q)} с ошибкой в последней попытке, из всех тем.` : 'Здесь появятся вопросы, в которых вы ошиблись.'}</p></div>
        <div class="mode-ctl"><button type="button" class="btn primary" data-act="start-mistakes"${mistakes ? '' : ' disabled'}>Начать</button></div>
      </article>
      <article class="mode">
        <div class="mode-main"><h3>Экзамен</h3><p>${pool ? `${examN} ${plural(examN, W_Q)}, ${examMin} ${plural(examMin, W_MIN)}, без подсказок. Разбор ошибок в конце.` : 'Вопросы поровну из выбранных тем, с таймером.'}</p></div>
        <div class="mode-ctl">${seg('exam-len', store.examLen, [[20, '20'], [30, '30']], 'Количество вопросов')}<button type="button" class="btn primary" data-act="start-exam"${pool ? '' : ' disabled'}>Начать</button></div>
      </article>
      ${pool ? '' : '<p class="notice">Выберите хотя бы одну тему ниже, чтобы начать тренировку или экзамен.</p>'}
    </section>
    <section class="topics" aria-label="Темы">
      <div class="topics-head">
        <h2 class="section-title">Темы</h2>
        <div class="topics-actions"><button type="button" class="link" data-act="sel-all">Выбрать все</button><button type="button" class="link" data-act="sel-none">Снять все</button></div>
      </div>
      <p class="muted small">Выбрано ${store.sel.length} ${plural(store.sel.length, W_T)}, ${pool} ${plural(pool, W_Q)}. Тренировка и экзамен берут вопросы только из выбранных тем.</p>
      <ul class="tree">${tree}</ul>
    </section>
    <footer class="foot">
      <p>Прогресс хранится только в этом браузере.</p>
      <button type="button" class="link danger" data-act="reset">${resetArmed ? 'Нажмите ещё раз, чтобы стереть прогресс' : 'Сбросить прогресс'}</button>
    </footer>`;
  home.querySelectorAll('[data-sec]').forEach(el => { el.indeterminate = el.dataset.ind === '1'; });
  if (focusSel) { const el = $(focusSel, home); if (el) el.focus({preventScroll: true}); }
  persist();
}

function optsHtml(q, perm, d, fb) {
  const multi = q.k === 'many', correct = multi ? q.a : [q.a];
  return `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-label="Варианты ответа">${perm.map((oi, pos) => {
    const on = multi ? d.includes(oi) : d === oi;
    let cls = 'opt opt-' + q.k + (on ? ' is-chosen' : ''), extra = '';
    if (fb) {
      if (correct.includes(oi)) { cls += ' is-correct'; if (!on && multi) { cls += ' is-missed'; extra = '<span class="miss-tag">не отмечен</span>'; } }
      else if (on) cls += ' is-wrong'; else cls += ' is-dim';
    }
    return `<button type="button" class="${cls}" data-act="pick" data-o="${oi}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}"${fb ? ' disabled' : ''}><span class="mark" aria-hidden="true"></span><span class="opt-text">${esc(q.o[oi])}</span>${extra || `<kbd>${pos + 1}</kbd>`}</button>`;
  }).join('')}</div>`;
}
function matchHtml(q, perm, d, fb) {
  const pool = q.p.map(p => p[1]).concat(q.x || []);
  return `<ol class="m-legend" aria-label="Варианты ответа">${perm.map((ri, pos) => `<li><b>${LETTERS[pos]}</b><span>${esc(pool[ri])}</span></li>`).join('')}</ol>
  <div class="m-rows">${q.p.map((p, li) => {
    const sel = d[li];
    const rowCls = fb ? (sel === li ? ' is-correct' : ' is-wrong') : '';
    return `<div class="m-row${rowCls}"><div class="m-left"><span class="num">${li + 1}</span><span>${esc(p[0])}</span></div>
      <div class="chips" role="radiogroup" aria-label="Ответ для пункта ${li + 1}">${perm.map((ri, pos) => {
        const on = sel === ri; let c = on ? ' on' : '';
        if (fb) { if (ri === li) c += ' right'; else if (on) c += ' bad'; }
        return `<button type="button" class="chip${c}" data-act="match" data-l="${li}" data-r="${ri}" role="radio" aria-checked="${on}" aria-label="${LETTERS[pos]}: ${esc(pool[ri])}"${fb ? ' disabled' : ''}>${LETTERS[pos]}</button>`;
      }).join('')}</div></div>`;
  }).join('')}</div>`;
}
function orderHtml(q, perm, d, fb) {
  const rest = perm.filter(oi => !d.includes(oi));
  const slots = range(q.o.length).map(pos => {
    const oi = d[pos];
    if (oi === undefined) return `<li class="slot empty"><span class="num">${pos + 1}</span><span>${pos === d.length ? 'Выберите вариант ниже' : ''}</span></li>`;
    const c = fb ? (oi === pos ? ' is-correct' : ' is-wrong') : '';
    return `<li class="slot${c}"><button type="button" data-act="ord-rm" data-pos="${pos}"${fb ? ' disabled' : ''} aria-label="Убрать: ${esc(q.o[oi])}"><span class="num">${pos + 1}</span><span class="opt-text">${esc(q.o[oi])}</span>${fb ? '' : '<span class="x" aria-hidden="true">×</span>'}</button></li>`;
  }).join('');
  const poolHtml = fb ? '' : `<p class="ord-label">Варианты</p><div class="ord-pool">${rest.length ? rest.map((oi, k) =>
    `<button type="button" class="opt" data-act="ord-add" data-o="${oi}"><span class="opt-text">${esc(q.o[oi])}</span><kbd>${k + 1}</kbd></button>`).join('') : '<p class="muted small">Все варианты расставлены. Нажмите на пункт выше, чтобы убрать его.</p>'}</div>`;
  return `<p class="ord-label">Ваша последовательность</p><ol class="ord-seq">${slots}</ol>${poolHtml}`;
}

function renderQuiz(focusSel) {
  const q = cur(), perm = S.perm[S.i], fb = S.phase === 'feedback', d = S.draft, total = S.ids.length;
  const tp = TOPIC[q.t], exam = S.mode === 'exam', isLast = S.i + 1 >= total;
  const done = S.i + (fb ? 1 : 0);
  const body = (q.k === 'one' || q.k === 'many') ? optsHtml(q, perm, d, fb) : q.k === 'match' ? matchHtml(q, perm, d, fb) : orderHtml(q, perm, d, fb);
  let fbHtml = '';
  if (fb) {
    const r = S.res[S.res.length - 1];
    fbHtml = `<div class="fb ${r.ok ? 'ok' : 'bad'}" role="status"><p class="fb-head">${r.ok ? '✓ Верно' : '✕ Неверно'}</p>${!r.ok && q.k === 'order' ? `<p>Правильный порядок:</p><ol>${q.o.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}<p>${esc(q.e)}</p></div>`;
  }
  const left = exam ? S.deadline - Date.now() : 0;
  quiz.innerHTML = `
    <div class="qbar">
      <div class="qbar-row">
        ${exam ? '<button type="button" class="link" data-act="finish">Завершить</button>' : '<button type="button" class="link" data-act="exit">← К темам</button>'}
        <span class="eyebrow">${MODE[S.mode]}</span>
        <span class="qbar-right"><span class="count">${S.i + 1} / ${total}</span>${exam ? `<span id="timer" class="timer${left < 60000 ? ' low' : ''}" aria-label="Осталось времени">${fmt(left)}</span>` : ''}</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Пройдено" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${done / total * 100}%"></i></div>
    </div>
    <article class="card">
      <div class="q-meta"><p class="eyebrow">${esc(tp.sec.name)} · ${esc(tp.name)}</p><p class="hint">${HINT[q.k]}</p></div>
      <h2 class="q-text">${esc(q.q)}</h2>
      ${body}
      ${fbHtml}
    </article>
    <p class="keys muted small">Клавиши: 1–9 — выбор варианта, Enter — ответить и перейти дальше</p>
    <div class="actions">
      ${fb ? `<button type="button" class="btn primary" data-act="next">${isLast ? 'Показать итог' : 'Дальше'}</button>`
           : `<button type="button" class="btn primary" data-act="submit"${complete(q, d) ? '' : ' disabled'}>${exam && isLast ? 'Ответить и завершить' : 'Ответить'}</button>`}
    </div>`;
  if (focusSel && viaKeyboard) { const el = $(focusSel, quiz); if (el && !el.disabled) el.focus({preventScroll: true}); }
  persist();
}

function ansHtml(q, ans) {
  if (ans === null || ans === undefined || (Array.isArray(ans) && !ans.length)) return '<em>нет ответа</em>';
  if (q.k === 'one') return esc(q.o[ans]);
  if (q.k === 'many') return `<ul>${ans.map(i => `<li>${esc(q.o[i])}</li>`).join('')}</ul>`;
  if (q.k === 'match') { const pool = q.p.map(p => p[1]).concat(q.x || []); return `<ul>${q.p.map((p, li) => `<li>${esc(p[0])} → ${ans[li] >= 0 ? esc(pool[ans[li]]) : '—'}</li>`).join('')}</ul>`; }
  return `<ol>${ans.map(i => `<li>${esc(q.o[i])}</li>`).join('')}</ol>`;
}
function renderResult() {
  const res = S.res, total = res.length, ok = res.filter(r => r.ok).length, pct = total ? Math.round(ok * 100 / total) : 0;
  const byT = {};
  res.forEach(r => { const t = QMAP[r.id].t; const o = byT[t] || (byT[t] = {ok: 0, n: 0}); o.n++; if (r.ok) o.ok++; });
  const topics = Object.keys(byT).sort((a, b) => AVAIL.indexOf(a) - AVAIL.indexOf(b));
  const wrong = res.filter(r => !r.ok);
  const dur = S.endedAt ? fmt(S.endedAt - S.startedAt) : '';
  result.innerHTML = `
    <header class="res-head">
      <p class="eyebrow">${MODE[S.mode]} · итог</p>
      <div class="score"><span class="big">${ok}</span><span class="of">из ${total} верно</span></div>
      <p class="muted">${pct}% правильных ответов${dur ? ` · время ${dur}` : ''}${S.timedOut ? ' · время вышло' : ''}</p>
    </header>
    <section class="block"><h2 class="section-title">По темам</h2>
      <div class="t-rows">${topics.map(t => { const o = byT[t], p = o.ok / o.n; return `<div class="t-row"><span class="name">${esc(TOPIC[t].name)}</span><span class="bar"><i class="${p < 0.5 ? 'low' : ''}" style="width:${p * 100}%"></i></span><span class="n">${o.ok}/${o.n}</span></div>`; }).join('')}</div>
    </section>
    <section class="block"><h2 class="section-title">${wrong.length ? `Ошибки · ${wrong.length}` : 'Ошибок нет'}</h2>
      ${wrong.length ? `<div class="errs">${wrong.map(r => { const q = QMAP[r.id]; return `<details class="err"><summary><span>${esc(q.q)}</span></summary><div class="err-body"><div><p class="lbl">Ваш ответ</p><div class="yours">${ansHtml(q, r.ans)}</div></div><div><p class="lbl">Правильный ответ</p><div class="right-ans">${ansHtml(q, correctOf(q))}</div></div><p>${esc(q.e)}</p></div></details>`; }).join('')}</div>`
        : '<p class="muted">Все ответы верные. Можно добавить темы или перейти к экзамену.</p>'}
    </section>
    <div class="actions">
      ${wrong.length ? '<button type="button" class="btn ghost" data-act="retry">Повторить ошибки</button>' : ''}
      <button type="button" class="btn primary" data-act="home">К темам</button>
    </div>`;
  persist();
}

/* ===== События ===== */
document.addEventListener('keydown', () => { viaKeyboard = true; }, true);
document.addEventListener('pointerdown', () => { viaKeyboard = false; }, true);

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'train-len') { store.trainLen = b.dataset.v === 'all' ? 'all' : +b.dataset.v; save(); renderHome(`[data-act="train-len"][data-v="${b.dataset.v}"]`); }
  else if (a === 'exam-len') { store.examLen = +b.dataset.v; save(); renderHome(`[data-act="exam-len"][data-v="${b.dataset.v}"]`); }
  else if (a === 'start-train') startSession('train', trainIds());
  else if (a === 'start-mistakes') startSession('mistakes', mistakeIds());
  else if (a === 'start-exam') startSession('exam', examIds());
  else if (a === 'sel-all') { store.sel = AVAIL.slice(); save(); renderHome('[data-act="sel-all"]'); }
  else if (a === 'sel-none') { store.sel = []; save(); renderHome('[data-act="sel-none"]'); }
  else if (a === 'reset') {
    clearTimeout(resetT);
    if (!resetArmed) { resetArmed = true; resetT = setTimeout(() => { resetArmed = false; if (view === 'home') renderHome(); }, 4000); }
    else { resetArmed = false; store.stats = {}; save(); }
    renderHome('[data-act="reset"]');
  }
  else if (a === 'pick' && S && S.phase === 'answer') {
    const q = cur(), oi = +b.dataset.o;
    if (q.k === 'one') S.draft = oi; else { const k = S.draft.indexOf(oi); if (k >= 0) S.draft.splice(k, 1); else S.draft.push(oi); }
    renderQuiz(`[data-act="pick"][data-o="${oi}"]`);
  }
  else if (a === 'match' && S && S.phase === 'answer') {
    const li = +b.dataset.l, ri = +b.dataset.r, d = S.draft;
    if (d[li] === ri) d[li] = -1; else { d.forEach((v, k) => { if (v === ri) d[k] = -1; }); d[li] = ri; }
    renderQuiz(`[data-act="match"][data-l="${li}"][data-r="${ri}"]`);
  }
  else if (a === 'ord-add' && S && S.phase === 'answer') { S.draft.push(+b.dataset.o); renderQuiz('.ord-pool .opt'); }
  else if (a === 'ord-rm' && S && S.phase === 'answer') { S.draft.splice(+b.dataset.pos, 1); renderQuiz('.ord-pool .opt'); }
  else if (a === 'submit') submit();
  else if (a === 'next') next();
  else if (a === 'exit') { S = null; show('home'); }
  else if (a === 'finish') {
    if (b.dataset.armed) finish();
    else { b.dataset.armed = '1'; b.textContent = 'Точно завершить?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Завершить'; } }, 3000); }
  }
  else if (a === 'retry') startSession('mistakes', shuffle(S.res.filter(r => !r.ok).map(r => r.id)));
  else if (a === 'home') { S = null; show('home'); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.topic) {
    const t = el.dataset.topic;
    store.sel = el.checked ? Array.from(new Set(store.sel.concat(t))) : store.sel.filter(x => x !== t);
    save(); renderHome(`[data-topic="${t}"]`);
  } else if (el.dataset.sec) {
    const sec = SECTIONS.find(s => s.id === el.dataset.sec);
    const ts = sec.topics.map(x => x[0]).filter(t => AVAIL.includes(t));
    store.sel = el.checked ? Array.from(new Set(store.sel.concat(ts))) : store.sel.filter(x => !ts.includes(x));
    save(); renderHome(`[data-sec="${sec.id}"]`);
  }
});

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.ctrlKey || e.metaKey || e.altKey) return;
  const q = cur();
  if (/^[1-9]$/.test(e.key) && S.phase === 'answer') {
    const n = +e.key - 1, perm = S.perm[S.i];
    if ((q.k === 'one' || q.k === 'many') && n < perm.length) {
      e.preventDefault(); const oi = perm[n];
      if (q.k === 'one') S.draft = oi; else { const k = S.draft.indexOf(oi); if (k >= 0) S.draft.splice(k, 1); else S.draft.push(oi); }
      renderQuiz();
    } else if (q.k === 'order') {
      const rest = perm.filter(oi => !S.draft.includes(oi));
      if (n < rest.length) { e.preventDefault(); S.draft.push(rest[n]); renderQuiz(); }
    }
  } else if (e.key === 'Enter') {
    const tag = e.target.tagName;
    if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SUMMARY') return;
    e.preventDefault();
    if (S.phase === 'answer') submit(); else next();
  }
});

/* ===== Запуск. Незаконченная сессия переживает перезагрузку вкладки (sessionStorage) ===== */
const SKEY = 'eco-trainer-session';
function persist() { try { sessionStorage.setItem(SKEY, JSON.stringify(S && view !== 'home' ? {view, S} : null)); } catch (e) {} }
function boot() {
  let data = null;
  try { data = JSON.parse(sessionStorage.getItem(SKEY)); } catch (e) { data = null; }
  if (data && data.S && Array.isArray(data.S.ids) && data.S.ids.length && data.S.ids.every(id => QMAP[id]) && (data.view === 'quiz' || data.view === 'result')) {
    S = data.S; show(data.view);
  } else show('home');
}
boot();
</script>
</body>
</html>
